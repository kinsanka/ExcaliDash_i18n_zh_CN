name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Chinese release tag (for example v0.6.7-zh.1)"
        required: true
        default: "v0.6.7-zh.1"
  push:
    tags:
      - "v*-zh.*"

permissions:
  contents: read

concurrency:
  group: publish-chinese-release
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: kinsanka

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Validate release tag
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${REQUESTED_TAG%-zh.*}" != "v${version}" || ! "$REQUESTED_TAG" =~ -zh\.[1-9][0-9]*$ ]]; then
            echo "Expected v${version}-zh.N release tag" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "label=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.component }}
    needs: metadata
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_BUILD_LABEL=${{ needs.metadata.outputs.label }}
            VITE_APP_BUILD_LABEL=${{ needs.metadata.outputs.label }}
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/excalidash-${{ matrix.component }}:${{ needs.metadata.outputs.tag }}
          cache-from: type=gha,scope=chinese-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=chinese-${{ matrix.component }}

  promote:
    name: Verify and promote image pair
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify both architectures
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          for component in backend frontend; do
            docker buildx imagetools inspect "${DOCKERHUB_NAMESPACE}/excalidash-${component}:${IMAGE_TAG}" --raw | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] as $architectures
              | ($architectures | index("amd64") != null) and ($architectures | index("arm64") != null)
            '
          done
      - name: Verify frontend ports and non-root execution
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.tag }}
        run: sh scripts/test-frontend-container.sh "${DOCKERHUB_NAMESPACE}/excalidash-frontend:${IMAGE_TAG}"
      - name: Promote verified images
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          for component in backend frontend; do
            image="${DOCKERHUB_NAMESPACE}/excalidash-${component}"
            docker buildx imagetools create --tag "${image}:latest" "${image}:${IMAGE_TAG}"
          done
